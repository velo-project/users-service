version: '3.8'

services:
  db:
    image: ankane/pgvector
    container_name: PGVECTOR
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root

    ports:
      - "5432:5432"
    expose:
      - "5432"

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: user-services
    ports:
      - "8080:8080"
    depends_on:
      - db