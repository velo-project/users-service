plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.4'
    id 'org.flywaydb.flyway' version '9.5.1'
    id "io.sentry.jvm.gradle" version "5.12.2"
}

group = 'com.github.veloproject.userservices.presentations'
version = '0.0.1-SNAPSHOT'

ext {
    grpcVersion = '1.65.0'
    protobufVersion = '3.25.1'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':domain')
    implementation project(':infrastructure')
    implementation project(':application')

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.security:spring-security-crypto:6.4.4'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.google.cloud:google-cloud-storage:2.56.0'
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    implementation "net.devh:grpc-server-spring-boot-starter:2.15.0.RELEASE"
    implementation 'javax.annotation:javax.annotation-api:1.3.2' // For @Generated annotation used by protoc
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation platform("io.sentry:sentry-bom:8.27.1")
    implementation "io.sentry:sentry-opentelemetry-agent"
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/java',
                    'build/generated/source/proto/main/grpc'
        }
    }
}

sentry {
    org = "velo-0yb"
    projectName = "velo-user"
}

// TODO: Refactor to Environments value
flyway {
    url = 'jdbc:postgresql://pgsql:5432/user_services'
    user = 'postgres'
    password = 'root'
    locations = ['filesystem:presentations/src/main/resources/db/migration']
    table = 'user_services_flyway_schema_history'
}

tasks.named("generateSentryBundleIdJava").configure {
    dependsOn("generateProto")
}

tasks.named("sentryCollectSourcesJava").configure {
    dependsOn("generateProto")
}
